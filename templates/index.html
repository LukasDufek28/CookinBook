{% extends "_base.html" %}
{% block title %}CookinBook - Home{% endblock %}
{% block head %}
{% endblock %}
{% block content %}
  <h1 class="meals-title">Meals</h1>
  <a href="/meal/new" class="add-meal-btn" title="Add Meal">+</a>
  <div class="meals">
    {% for meal in meals %}
      <a href="/meal/{{ meal.id }}" style="text-decoration:none; color:inherit;">
        <div class="card" style="cursor:pointer;">
          <img src="{{ meal.image_url or url_for('static', filename='placeholder.svg') }}" alt="{{ meal.name }}">
          <h3>{{ meal.name }}</h3>
        </div>
      </a>
    {% else %}
      <p>No meals available yet.</p>
    {% endfor %}
  </div>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: url('/static/favicon.PNG') no-repeat center center;
      background-size: 350px 350px;
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
{% endblock %}
