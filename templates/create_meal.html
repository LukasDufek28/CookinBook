<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Meal - CookinBook</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-weight: bold; }
    input, textarea, select { padding: 6px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    .actions { display: flex; gap: 12px; }
    .btn { background: #28a745; color: #fff; border: none; padding: 8px 18px; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    .btn:hover { background: #218838; }
    .back-link { text-decoration: none; color: #007bff; margin-bottom: 16px; display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="/">← Back to Meals</a>
    <h1>Create a New Meal</h1>
    <form method="post">
      <label for="name">Meal Name</label>
      <input type="text" id="name" name="name" required>

      <label for="image_url">Image URL (optional)</label>
      <input type="text" id="image_url" name="image_url" placeholder="/static/placeholder.svg">

      <label for="time_minutes">Time (minutes)</label>
      <input type="number" id="time_minutes" name="time_minutes" min="1" required>



      <label>Ingredients and Amount (grams)</label>
      <input type="text" id="ingredientSearch" placeholder="Search ingredients..." style="margin-bottom:8px; width:100%; padding:6px;">
      <div id="ingredientList">
        {% for ing in ingredients %}
          <div class="ingredient-item" style="margin-bottom:6px;">
            <input type="checkbox" name="ingredients" value="{{ ing.id }}" id="ing_{{ ing.id }}">
            <label for="ing_{{ ing.id }}">{{ ing.name }}</label>
            <input type="number" name="grams_{{ ing.id }}" min="0" step="1" placeholder="grams" style="width:80px;">
          </div>
        {% endfor %}
      </div>
      <script>
        // Remove diacritics for search
        function normalize(str) {
          return str.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
        }
        document.addEventListener('DOMContentLoaded', function() {
          const search = document.getElementById('ingredientSearch');
          const items = document.querySelectorAll('#ingredientList .ingredient-item');
          search.addEventListener('input', function() {
            const val = normalize(search.value);
            items.forEach(function(item) {
              const label = normalize(item.querySelector('label').textContent);
              item.style.display = label.includes(val) ? '' : 'none';
            });
          });
        });
      </script>

      <label for="recipe">Recipe</label>
      <textarea id="recipe" name="recipe" rows="5" required></textarea>

      <div class="actions">
        <button class="btn" type="submit">Save Meal</button>
        <a class="btn" href="/">Cancel</a>
      </div>
    </form>
    {% if error %}
      <p style="color:red;">{{ error }}</p>
    {% endif %}
  </div>
</body>
</html>
